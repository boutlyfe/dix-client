name: dix
description: Dix — Windows VPN client.
publish_to: none
version: 0.2.4+6
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.3
  lucide_icons_flutter: ^3.0.0
  country_flags: ^4.1.2
  shared_preferences: ^2.5.3
  file_selector: ^1.0.4
  http: ^1.6.0
  yaml: ^3.1.3
  path_provider: ^2.1.5
  window_manager: ^0.5.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
  assets:
    - assets/dix-icon-rounded.svg
    - assets/dix-glyph.svg
    - assets/icon.png
    - assets/land_mask.png
    - assets/LAND_MASK_LICENSE.md
    - assets/fonts/OFL.txt
