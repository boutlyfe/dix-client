name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: |
            core/go.sum
            core/Clash.Meta/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $spec = Get-Content pubspec.yaml -Raw
          if ($spec -notmatch '(?m)^version:\s*([^+\s]+)') { throw 'Missing version' }
          if ($env:RELEASE_TAG -ne "v$($Matches[1])") { throw 'Release tag must match pubspec.yaml version' }
      - name: Build DixCore from source
        run: ./scripts/build-core.ps1
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub
      - name: Build Windows release
        run: flutter build windows --release --no-pub
      - name: Verify isolated native core
        run: |
          $exe = (Resolve-Path build/windows/x64/runner/Release/Dix.exe).Path
          $report = Join-Path $env:RUNNER_TEMP 'dix-core-report.json'
          $process = Start-Process -FilePath $exe -ArgumentList @('--self-test-core', ('"' + $report + '"')) -WorkingDirectory (Split-Path $exe) -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(90000)) { Stop-Process -Id $process.Id -Force; throw 'Native core test timed out' }
          if ($process.ExitCode -ne 0) { throw "Native core test failed ($($process.ExitCode))" }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          foreach ($key in @('windowsJobAttached', 'initialized', 'invalidRuleRejected', 'configurationApplied', 'selectedProxyRouted', 'runtimeGroupSwitchVerified', 'directRouted', 'rejectBlocked', 'closeConnectionsVerified', 'trafficReadable', 'closed')) {
            if ($result.$key -ne $true) { throw "Native check failed: $key" }
          }
          Get-Content -LiteralPath $report
      - name: Package runtime and notices
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: dix-windows
          path: |
            artifacts/Dix-Windows-*.zip
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dix-windows
          path: artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/Dix-Windows-*.zip artifacts/SHA256SUMS --verify-tag --title "Dix ${RELEASE_TAG#v}" --generate-notes
